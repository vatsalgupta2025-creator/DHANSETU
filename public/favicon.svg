<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Bridge arch -->
  <path d="M6 21 Q16 9 26 21" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Bridge pillars -->
  <line x1="10" y1="17" x2="10" y2="24" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="16" y1="12" x2="16" y2="24" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="22" y1="17" x2="22" y2="24" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Base line -->
  <line x1="5" y1="24" x2="27" y2="24" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Rupee symbol -->
  <text x="16" y="10" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" font-weight="bold" fill="white">₹</text>
</svg>